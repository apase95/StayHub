version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stayhub_postgres
    restart: always
    environment:
      POSTGRES_USER: stayhub_user
      POSTGRES_PASSWORD: 123321999
      POSTGRES_DB: stayhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: