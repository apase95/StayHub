<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StayHub</title>
    <link th:href="@{/css/tailwind.css}" rel="stylesheet">
</head>
<body class="bg-bg-light text-text-900 font-sans flex flex-col min-h-screen">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-bg-white border border-border rounded-xl shadow-sm w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-center mb-6">Welcome back to StayHub</h1>

            <!-- Success Message after Registration -->
            <div th:if="${param.registered}" class="bg-success-500 bg-opacity-10 text-success-500 p-3 rounded-lg mb-4 text-sm text-center">
                Registration successful! Please log in.
            </div>

            <!-- Error Message from Spring Security -->
            <div th:if="${param.error}" class="bg-primary-500 bg-opacity-10 text-primary-600 p-3 rounded-lg mb-4 text-sm text-center">
                Invalid email or password.
            </div>

            <!-- Logout Success Message -->
            <div th:if="${param.logout}" class="bg-success-500 bg-opacity-10 text-success-500 p-3 rounded-lg mb-4 text-sm text-center">
                You have been logged out.
            </div>

            <!-- Login Form (POST action handled by Spring Security) -->
            <!-- IMPORTANT: name must be 'username' and 'password' for Spring Security to recognize -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                
                <div>
                    <label for="username" class="block text-sm font-semibold mb-1">Email</label>
                    <input type="email" id="username" name="username" required
                           class="w-full px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary-500 focus:outline-none transition">
                </div>

                <button type="submit" 
                        class="w-full bg-primary-500 hover:bg-primary-600 text-bg-white font-bold py-3 rounded-lg transition mt-2">
                    Sign in
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-text-gray">
                Don't have an account? 
                <a th:href="@{/register}" class="text-primary-500 hover:underline font-semibold">Sign up</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
