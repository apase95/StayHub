<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Fragment Navbar -->
    <header th:fragment="navbar" class="bg-bg-white border-b border-border h-[72px] flex items-center justify-between px-6 lg:px-10 sticky top-0 z-50">
        
        <!-- Logo Left -->
        <a th:href="@{/}" class="flex items-center gap-2 text-primary-500 hover:text-primary-600 transition">
            <!-- Icon tạm thời -->
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            <span class="text-xl font-bold font-sans hidden md:block">StayHub</span>
        </a>

        <!-- Search Bar (Center) -->
        <div class="hidden md:flex items-center border border-border rounded-full shadow-sm hover:shadow-md transition cursor-pointer px-4 py-2 text-sm font-semibold text-text-900">
            <span class="px-4 border-r border-border">Anywhere</span>
            <span class="px-4 border-r border-border">Any week</span>
            <span class="px-4 text-text-gray font-normal">Add guests</span>
            <div class="bg-primary-500 text-bg-white p-2 rounded-full ml-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Right Menu -->
        <div class="flex items-center gap-4 text-sm font-semibold text-text-900">
            <a th:href="@{/host/dashboard}" class="hidden md:block hover:bg-bg-light px-4 py-2 rounded-full transition">Host your home</a>
            
            <!-- User Menu Pill -->
            <div class="flex items-center gap-2 border border-border rounded-full p-2 hover:shadow-md transition cursor-pointer">
                <svg class="w-5 h-5 text-text-gray ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <div class="bg-text-gray text-bg-white rounded-full p-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
