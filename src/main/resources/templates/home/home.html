<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHub - Discover Your Perfect Getaway</title>
    <!-- Tailwind CSS -->
    <link th:href="@{/css/tailwind.css}" rel="stylesheet">
</head>
<body class="bg-bg-white text-text-900 font-sans flex flex-col min-h-screen m-0 p-0">
    
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 lg:px-10 w-full mt-8">
        <h1 class="text-4xl font-bold text-primary-500 mb-4">Trang chủ StayHub đã hoạt động!</h1>
        <p class="text-text-gray text-lg" th:text="${message}"></p>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
